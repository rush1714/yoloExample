# S3 训练图片 + Label Studio + EC2 工作流示例配置。
#
# 使用方式：复制为 config/brand_s3_ec2.local.yaml 后填写真实桶、目录和 EC2 参数。
# 不要把 AWS access key / secret 写入本文件；本地上传使用 AWS_PROFILE / 环境变量，
# EC2 下载建议使用实例 IAM Role、远端 AWS_PROFILE 或远端环境变量。

dataset_name: local_dataset
label_name: diaper
local_images_dir: data/local_import/images
dataset_root: datasets/s3/local_dataset

s3:
  bucket: your-bucket-name
  # 只填写业务子目录；程序会自动上传到 yolo-training/<prefix>/...
  prefix: local_dataset
  region: ap-southeast-1
  profile: default
  endpoint_url:
  public_base_url:

label_studio:
  # nginx：Label Studio 通过本地 Nginx 代理加载 S3 图片；Nginx 可使用预签名 URL 并做本地缓存。
  # proxy：回退到旧 Python 代理；https：仅当对象可公开访问且浏览器可加载时使用。
  image_url_mode: nginx
  proxy_base_url: http://127.0.0.1:3010
  proxy_allowed_origin: http://localhost:9001
  project_title: S3 Images local_dataset

ec2:
  host: 1.2.3.4
  user: ec2-user
  key: ~/.ssh/smdp-yolo-gpu-key.pem
  project_root: /home/ec2-user/yoloExample
