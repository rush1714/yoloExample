[project]
name = "yoloexample"
version = "0.1.0"
description = "Local Softcare diaper detection and counting demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clip",
    "easyocr>=1.7.2",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.14.5",
    "rapidocr-onnxruntime>=1.4.4",
    "ultralytics>=8.3.0",
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
