[project]
name = "yoloexample"
version = "0.1.0"
description = "Local multibrand package detection and counting demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clip",
    "easyocr>=1.7.2",
    "label-studio>=1.23.0",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=10.0.0",
    "projects",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.14.5",
    "rapidocr-onnxruntime>=1.4.4",
    "tasks-py>=1.0.3",
    "ultralytics>=8.3.0",
]

[tool.uv]
# 强制使用 opencv-python-headless>=5.0.0，覆盖 label-studio-sdk 的 <5.0.0 约束
override-dependencies = [
    "opencv-python-headless>=5.0.0.93",
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
